# The source repo is private, and a private repo's GitHub-hosted minutes can run out.
# This public repo still has free minutes. It checks the private source out with
# CAMERA_SRC_TOKEN and publishes the EXE here, as build-N, which the program updates from.
name: Build EXE from private source

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check the source token exists
        shell: pwsh
        working-directory: .
        env:
          TOKEN: ${{ secrets.CAMERA_SRC_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TOKEN)) {
            Write-Error "Missing secret CAMERA_SRC_TOKEN. It must be able to read koby479/camera-."
            exit 1
          }

      - name: Checkout the private source
        uses: actions/checkout@v4
        with:
          repository: koby479/camera-
          ref: main
          token: ${{ secrets.CAMERA_SRC_TOKEN }}
          path: src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (program + test tools)
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest tests -q --tb=short --ignore=tests/test_single_instance.py

      - name: Run the single-instance test on its own (it uses a Qt local server)
        run: python -m pytest tests/test_single_instance.py -q

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout the private source
        uses: actions/checkout@v4
        with:
          repository: koby479/camera-
          ref: main
          token: ${{ secrets.CAMERA_SRC_TOKEN }}
          path: src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stamp the next public build number
        id: stamp
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ "User-Agent" = "ucv-build"; "Accept" = "application/vnd.github+json" } -Uri "https://api.github.com/repos/koby479/update/releases/latest"
          $n = 1
          if ($rel.tag_name -match 'build-(\d+)') { $n = [int]$Matches[1] + 1 }
          Set-Content -Path app/_build.py -Value "BUILD = $n" -Encoding ascii
          "n=$n" >> $env:GITHUB_OUTPUT
          Get-Content app/_build.py

      - name: Locate onvif WSDL directory
        id: onvif_wsdl
        shell: pwsh
        run: |
          $wsdl = python -c "import onvif, os; print(os.path.join(os.path.dirname(onvif.__file__), 'wsdl'))"
          "path=$wsdl" >> $env:GITHUB_OUTPUT
          Write-Host "Found WSDL dir: $wsdl"

      - name: Build EXE with PyInstaller (normal, windowed)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon "app/assets/logo.ico" --name "UniversalCamViewer" --collect-all numpy --collect-all cv2 --collect-all onvif --collect-all av --collect-all zeep --collect-all wsdiscovery --add-data "${{ steps.onvif_wsdl.outputs.path }};onvif\wsdl" --add-data "app;app" app/main.py

      - name: Build DEBUG EXE with PyInstaller (console, shows errors)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console --icon "app/assets/logo.ico" --name "UniversalCamViewer-DEBUG" --collect-all numpy --collect-all cv2 --collect-all onvif --collect-all av --collect-all zeep --collect-all wsdiscovery --add-data "${{ steps.onvif_wsdl.outputs.path }};onvif\wsdl" --add-data "app;app" app/main.py

      - name: SHA-256 of the EXE (the program checks its update against it)
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/UniversalCamViewer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/UniversalCamViewer.exe.sha256 -Value $hash -Encoding ascii
          Get-Content dist/UniversalCamViewer.exe.sha256

      - name: Smoke test - the built EXE starts and reports its own build number
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ucv-info.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\UniversalCamViewer.exe" -ArgumentList "--build-info-file", "`"$out`"" -PassThru
          for ($i = 0; $i -lt 90; $i++) { if (Test-Path $out) { break }; Start-Sleep -Seconds 1 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path $out)) { Write-Error "The built EXE did not start (no build info written)."; exit 1 }
          $text = (Get-Content $out -Raw).Trim()
          Write-Host "EXE says: $text"
          $expected = "${{ steps.stamp.outputs.n }}"
          if (-not $text.EndsWith("|$expected")) { Write-Error "Wrong build number in the EXE: '$text', expected ...|$expected"; exit 1 }

      - name: Build the installer (Next, Next, Finish) with Inno Setup
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "from app import VERSION; print(VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver.${{ steps.stamp.outputs.n }}" installer\installer.iss
          if (-not (Test-Path dist\UniversalCamViewer-Setup.exe)) { Write-Error "Installer was not created"; exit 1 }
          Get-Item dist\UniversalCamViewer-Setup.exe | Select-Object Name, Length

      - name: Publish release on this public repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.stamp.outputs.n }}
          name: Build ${{ steps.stamp.outputs.n }}
          make_latest: true
          body: |
            גרסה 1.55
            השוואה: אם אין אריחים פתוחים אבל הבדיקה החיה פתחה תמונה, זה מה שכתוב. בדיקת פורט קצרה שלא הספיקה לא נקראת פורט סגור כשהזרם כן נפתח. תמונות דרך האתר מסומנות תמונות HTTP. זרם משני שאיחר נשאר משני ולא מוחלף בראשי.
            NVR ענן: האריחים מעתיקים את התמונה החיה של התוסף.
          files: |
            src/dist/UniversalCamViewer.exe
            src/dist/UniversalCamViewer.exe.sha256
            src/dist/UniversalCamViewer-DEBUG.exe
            src/dist/UniversalCamViewer-Setup.exe
